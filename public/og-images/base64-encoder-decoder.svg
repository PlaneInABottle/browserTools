<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#1e293b"/>
  <text x="600" y="120" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700">Base64 Encoder/Decoder</text>
  <text x="600" y="170" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Free Online Base64 Converter</text>

  <!-- Encode/Decode illustration -->
  <g transform="translate(200, 250)">
    <!-- Left box (Text) -->
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#3b82f6" opacity="0.8"/>
    <text x="75" y="30" text-anchor="middle" fill="white" font-family="monospace" font-size="14" font-weight="500">Hello World</text>
    <text x="75" y="55" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="12">Text Input</text>

    <!-- Arrow -->
    <path d="M170 40 L190 40 L185 35 M190 40 L185 45" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="180" y="25" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Encode</text>

    <!-- Right box (Base64) -->
    <rect x="200" y="0" width="200" height="80" rx="8" fill="#10b981" opacity="0.8"/>
    <text x="300" y="30" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="500">SGVsbG8gV29ybGQ=</text>
    <text x="300" y="55" text-anchor="middle" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Base64 Output</text>
  </g>

  <!-- Features -->
  <g transform="translate(600, 380)">
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <text x="20" y="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Bidirectional conversion</text>

    <circle cx="0" cy="30" r="8" fill="#10b981"/>
    <text x="20" y="35" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">File upload support</text>

    <circle cx="0" cy="60" r="8" fill="#f59e0b"/>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Unicode compatible</text>
  </g>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">toolympics.dev/tools/base64-encoder-decoder</text>
</svg>