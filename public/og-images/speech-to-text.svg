<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#1e293b"/>

  <!-- Microphone icon -->
  <circle cx="300" cy="240" r="80" fill="#3b82f6"/>
  <rect x="280" y="200" width="40" height="60" rx="20" fill="white"/>
  <rect x="290" y="220" width="20" height="20" rx="10" fill="#3b82f6"/>
  <path d="M260 250 Q300 280 340 250" stroke="white" stroke-width="6" fill="none"/>
  <rect x="297" y="270" width="6" height="30" fill="white"/>

  <!-- Arrow -->
  <path d="M420 315 L480 315" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Text lines icon -->
  <g transform="translate(650, 220)">
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#10b981"/>
    <rect x="0" y="20" width="180" height="8" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="0" y="40" width="190" height="8" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="0" y="60" width="170" height="8" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="0" y="80" width="185" height="8" rx="4" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="600" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Speech to Text</text>
  <text x="600" y="150" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">AI-Powered Transcription</text>

  <!-- Features -->
  <text x="600" y="400" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Record audio or upload files</text>
  <text x="600" y="430" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Powered by Whisper AI</text>
  <text x="600" y="460" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Choose model for speed vs accuracy</text>
  <text x="600" y="490" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">100% private & browser-based</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">toolympics.com/tools/speech-to-text</text>
</svg>
