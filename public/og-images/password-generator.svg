<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Security Pattern -->
  <g opacity="0.1">
    <rect x="100" y="100" width="200" height="200" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <rect x="350" y="150" width="150" height="150" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="550" y="200" width="100" height="100" rx="8" fill="none" stroke="#ef4444" stroke-width="2"/>
    <rect x="700" y="250" width="80" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="850" y="300" width="60" height="60" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Lock Icon -->
  <g transform="translate(150, 200)">
    <rect x="20" y="40" width="60" height="50" rx="8" fill="none" stroke="#10b981" stroke-width="4"/>
    <rect x="35" y="25" width="30" height="25" rx="15" fill="none" stroke="#10b981" stroke-width="4"/>
    <circle cx="50" cy="50" r="8" fill="#10b981"/>
    <rect x="46" y="46" width="8" height="8" fill="#0f172a"/>
  </g>

  <!-- Main Content -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Password Generator
  </text>

  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#cbd5e1">
    Generate strong, secure passwords instantly
  </text>

  <!-- Password Example -->
  <rect x="350" y="400" width="500" height="80" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="370" y="430" font-family="monospace" font-size="20" fill="#10b981">
    g8K#mP$2vL9nR@4wQ
  </text>
  <text x="370" y="455" font-family="Arial, sans-serif" font-size="14" fill="#6ee7b7">
    Strong • 16 characters • Mixed types
  </text>

  <!-- Security Indicators -->
  <g transform="translate(400, 520)">
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="16" fill="#10b981">Cryptographically Secure</text>

    <circle cx="250" cy="0" r="8" fill="#10b981"/>
    <text x="270" y="5" font-family="Arial, sans-serif" font-size="16" fill="#10b981">No Data Collection</text>
  </g>

  <!-- Toolympics Branding -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
    Toolympics
  </text>
</svg>