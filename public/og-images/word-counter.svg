<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#1e293b"/>

  <!-- Document icon with lines -->
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="200" height="260" rx="12" fill="#334155"/>
    <rect x="20" y="30" width="160" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="50" width="140" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="70" width="150" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="90" width="130" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="120" width="160" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="140" width="145" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="160" width="155" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="190" width="160" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="210" width="140" height="8" rx="4" fill="#64748b"/>
  </g>

  <!-- Stats display -->
  <g transform="translate(550, 180)">
    <rect x="0" y="0" width="400" height="260" rx="12" fill="#1e40af"/>
    <text x="200" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">1,234</text>
    <text x="200" y="100" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">Words</text>
    <rect x="50" y="130" width="300" height="2" fill="#60a5fa" opacity="0.3"/>
    <g opacity="0.9">
      <text x="80" y="170" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Characters: 6,789</text>
      <text x="80" y="200" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Sentences: 56</text>
      <text x="80" y="230" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Reading time: 5 min</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Word Counter</text>
  <text x="600" y="150" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Real-Time Text Analysis</text>

  <!-- Features -->
  <text x="600" y="500" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Count words, characters, sentences • Reading & speaking time • Keyword density • 100% private</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">toolympics.com/tools/word-counter</text>
