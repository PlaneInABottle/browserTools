<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#1e293b"/>
  <rect x="90" y="90" width="420" height="450" rx="16" fill="#334155"/>
  <rect x="540" y="90" width="570" height="450" rx="16" fill="#334155"/>

  <!-- Video icon -->
  <circle cx="300" cy="240" r="60" fill="#3b82f6"/>
  <polygon points="280,220 320,240 280,260" fill="white"/>

  <!-- Arrow -->
  <path d="M450 315 L480 315" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- GIF icon -->
  <rect x="510" y="210" width="120" height="80" rx="8" fill="#10b981"/>
  <text x="570" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">GIF</text>
  <rect x="550" y="260" width="40" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="550" y="270" width="30" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="550" y="280" width="35" height="4" rx="2" fill="white" opacity="0.7"/>

  <!-- Title -->
  <text x="600" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Video to GIF</text>
  <text x="600" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Converter</text>

  <!-- Features -->
  <text x="600" y="400" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Convert videos to animated GIFs</text>
  <text x="600" y="430" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Customize quality & dimensions</text>
  <text x="600" y="460" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Trim clips & adjust frame rate</text>
  <text x="600" y="490" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">100% private & browser-based</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">quicktools.dev/tools/video-to-gif</text>
</svg>